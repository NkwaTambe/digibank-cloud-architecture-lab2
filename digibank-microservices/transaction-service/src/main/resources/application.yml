server:
  port: 8083

spring:
  application:
    name: transaction-service
  config:
    import: optional:configserver:http://localhost:8888
  datasource:
    url: jdbc:postgresql://localhost:5435/digibank_transaction_db
    username: digibankuser
    password: digibankpwd
    driver-class-name: org.postgresql.Driver
  jpa:
    hibernate:
      ddl-auto: update

eureka:
  client:
    service-url:
      defaultZone: http://localhost:8761/eureka/

resilience4j:
  circuitbreaker:
    instances:
      compliance-service:
        sliding-window-size: 5
        failure-rate-threshold: 50
      account-service:
        sliding-window-size: 5
        failure-rate-threshold: 50
      notification-service:
        sliding-window-size: 5
        failure-rate-threshold: 50
