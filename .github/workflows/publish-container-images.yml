name: Publish DigiBank Container Images

on:
  push:
    branches: ["main"]
  workflow_dispatch:

permissions:
  contents: read
  packages: write

jobs:
  publish:
    name: Build and publish images
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
          cache: maven

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Set image namespace
        run: echo "IMAGE_NAMESPACE=ghcr.io/$(printf '%s' "$GITHUB_REPOSITORY_OWNER" | tr '[:upper:]' '[:lower:]')" >> "$GITHUB_ENV"

      - name: Download and verify PostgreSQL JDBC driver
        run: |
          set -euo pipefail
          mvn --batch-mode --file digibank-parent/pom.xml dependency:copy \
            -Dartifact=org.postgresql:postgresql:42.7.5 \
            -DoutputDirectory=.
          echo "69020b3bd20984543e817393f2e6c01a890ef2e37a77dd11d6d8508181d079ab  postgresql-42.7.5.jar" | sha256sum --check --status

      - name: Build Lab 2 Jakarta EE WAR
        run: mvn --batch-mode --file digibank-parent/pom.xml clean verify

      - name: Build Lab 3 Spring Boot WAR
        run: mvn --batch-mode --file digibank-parent-spring/pom.xml clean verify

      - name: Publish Lab 2 image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: Dockerfile.wildfly
          push: true
          tags: |
            ${{ env.IMAGE_NAMESPACE }}/digibank-lab2:latest
            ${{ env.IMAGE_NAMESPACE }}/digibank-lab2:sha-${{ github.sha }}

      - name: Publish Lab 3 image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: Dockerfile.wildfly
          push: true
          build-args: WAR_PATH=digibank-parent-spring/digibank-app/target/digibank-app.war
          tags: |
            ${{ env.IMAGE_NAMESPACE }}/digibank-lab3-spring:latest
            ${{ env.IMAGE_NAMESPACE }}/digibank-lab3-spring:sha-${{ github.sha }}

      - name: Build Lab 4 microservices
        run: mvn --batch-mode --file digibank-microservices/pom.xml clean verify

      - name: Publish Lab 4 microservice images
        env:
          IMAGE_NAMESPACE: ${{ env.IMAGE_NAMESPACE }}
          IMAGE_TAG: sha-${{ github.sha }}
        run: |
          set -euo pipefail
          for service in discovery-server config-server api-gateway customer-service account-service transaction-service compliance-service notification-service; do
            docker buildx build \
              --file "digibank-microservices/${service}/Dockerfile" \
              --tag "${IMAGE_NAMESPACE}/digibank-${service}:latest" \
              --tag "${IMAGE_NAMESPACE}/digibank-${service}:${IMAGE_TAG}" \
              --push \
              digibank-microservices
          done