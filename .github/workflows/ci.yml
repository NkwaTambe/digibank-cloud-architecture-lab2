name: Java CI/CD Pipeline with Quality Gates

on:
  push:
    branches: [ "main", "develop" ]
  pull_request:
    branches: [ "main", "develop" ]

jobs:
  code-quality:
    name: Code Quality Checks
    runs-on: ubuntu-latest

    steps:
    - name: Checkout repository
      uses: actions/checkout@v4

    - name: Set up JDK 17
      uses: actions/setup-java@v4
      with:
        java-version: '17'
        distribution: 'temurin'
        cache: maven

    - name: Run Checkstyle
      run: |
        echo "::group::Running Checkstyle Analysis"
        mvn -B checkstyle:check --file digibank-parent/pom.xml || {
          echo "::error::Checkstyle violations found. See report below:"
          cat digibank-parent/target/checkstyle-result.xml 2>/dev/null || true
          exit 1
        }
        echo "::endgroup::"

    - name: Run PMD Analysis
      run: |
        echo "::group::Running PMD Static Analysis"
        mvn -B pmd:check --file digibank-parent/pom.xml || {
          echo "::error::PMD violations found. See report below:"
          cat digibank-parent/target/pmd.xml 2>/dev/null || true
          exit 1
        }
        echo "::endgroup::"

    - name: Upload Quality Reports
      if: always()
      uses: actions/upload-artifact@v4
      with:
        name: quality-reports
        path: |
          digibank-parent/target/checkstyle-result.xml
          digibank-parent/target/pmd.xml
          digibank-parent/**/target/checkstyle-result.xml
          digibank-parent/**/target/pmd.xml
        retention-days: 30

  build-and-test:
    name: Build and Test
    runs-on: ubuntu-latest
    needs: code-quality

    steps:
    - name: Checkout repository
      uses: actions/checkout@v4

    - name: Set up JDK 17
      uses: actions/setup-java@v4
      with:
        java-version: '17'
        distribution: 'temurin'
        cache: maven

    - name: Compile and Run Tests
      run: |
        echo "::group::Compiling Project"
        mvn -B clean compile --file digibank-parent/pom.xml
        echo "::endgroup::"
        
        echo "::group::Running Tests"
        mvn -B test --file digibank-parent/pom.xml
        echo "::endgroup::"

    - name: Generate Test Report
      if: always()
      run: |
        echo "::group::Test Results Summary"
        find digibank-parent -name "TEST-*.xml" -exec cat {} \; | grep -E "(tests|failures|errors|time)" || true
        echo "::endgroup::"

    - name: Upload Test Results
      if: always()
      uses: actions/upload-artifact@v4
      with:
        name: test-results
        path: |
          digibank-parent/**/target/surefire-reports/
          digibank-parent/**/target/failsafe-reports/
        retention-days: 30

  full-verify:
    name: Full Maven Verify
    runs-on: ubuntu-latest
    needs: [code-quality, build-and-test]

    steps:
    - name: Checkout repository
      uses: actions/checkout@v4

    - name: Set up JDK 17
      uses: actions/setup-java@v4
      with:
        java-version: '17'
        distribution: 'temurin'
        cache: maven

    - name: Run Full Maven Verify
      run: |
        echo "::group::Running Full Maven Verify (includes SpotBugs, PMD, Checkstyle)"
        mvn -B clean verify --file digibank-parent/pom.xml
        echo "::endgroup::"

    - name: Upload Build Artifacts
      uses: actions/upload-artifact@v4
      with:
        name: build-artifacts
        path: |
          digibank-parent/digibank-app/target/*.war
        retention-days: 7

  docker-build:
    name: Docker Build Test
    runs-on: ubuntu-latest
    needs: build-and-test

    steps:
    - name: Checkout repository
      uses: actions/checkout@v4

    - name: Set up Docker Buildx
      uses: docker/setup-buildx-action@v3

    - name: Build Docker Image
      run: |
        echo "::group::Building WildFly Docker Image"
        docker build -f Dockerfile.wildfly -t digibank-app:test .
        echo "::endgroup::"
        
        echo "::group::Docker Image Info"
        docker images digibank-app:test
        echo "::endgroup::"

    - name: Test Docker Compose
      run: |
        echo "::group::Testing Docker Compose Configuration"
        docker compose config
        echo "::endgroup::"
