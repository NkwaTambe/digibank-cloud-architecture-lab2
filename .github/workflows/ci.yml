name: Java CI/CD Pipeline with Quality Gates

on:
  push:
    branches: [ "main", "develop" ]
  pull_request:
    branches: [ "main", "develop" ]

jobs:
  build-and-quality:
    name: Build, Test and Quality Checks
    runs-on: ubuntu-latest

    steps:
    - name: Checkout repository
      uses: actions/checkout@v4

    - name: Set up JDK 17
      uses: actions/setup-java@v4
      with:
        java-version: '17'
        distribution: 'temurin'
        cache: maven

    - name: Build and Install
      run: |
        echo "::group::Building and Installing Modules"
        mvn -B clean install -DskipTests --file digibank-parent/pom.xml
        echo "::endgroup::"

    - name: Run Checkstyle
      run: |
        echo "::group::Running Checkstyle Analysis"
        mvn -B checkstyle:check --file digibank-parent/pom.xml
        echo "::endgroup::"

    - name: Run PMD Analysis
      run: |
        echo "::group::Running PMD Static Analysis"
        mvn -B pmd:check --file digibank-parent/pom.xml
        echo "::endgroup::"

    - name: Run Tests
      run: |
        echo "::group::Running JUnit and Cucumber Tests"
        mvn -B test --file digibank-parent/pom.xml
        echo "::endgroup::"

    - name: Upload Quality Reports
      if: always()
      uses: actions/upload-artifact@v4
      with:
        name: quality-reports
        path: |
          digibank-parent/target/checkstyle-result.xml
          digibank-parent/target/pmd.xml
          digibank-parent/**/target/checkstyle-result.xml
          digibank-parent/**/target/pmd.xml
          digibank-parent/**/target/site/
        retention-days: 30

    - name: Upload Test Results
      if: always()
      uses: actions/upload-artifact@v4
      with:
        name: test-results
        path: |
          digibank-parent/**/target/surefire-reports/
          digibank-parent/**/target/failsafe-reports/
        retention-days: 30

    - name: Upload Build Artifacts
      uses: actions/upload-artifact@v4
      with:
        name: build-artifacts
        path: |
          digibank-parent/digibank-app/target/*.war
        retention-days: 7

  full-verify:
    name: Full Maven Verify
    runs-on: ubuntu-latest
    needs: build-and-quality

    steps:
    - name: Checkout repository
      uses: actions/checkout@v4

    - name: Set up JDK 17
      uses: actions/setup-java@v4
      with:
        java-version: '17'
        distribution: 'temurin'
        cache: maven

    - name: Run Full Maven Verify
      run: |
        echo "::group::Running Full Maven Verify (includes SpotBugs, PMD, Checkstyle)"
        mvn -B clean verify --file digibank-parent/pom.xml
        echo "::endgroup::"

  docker-build:
    name: Docker Build Test
    runs-on: ubuntu-latest
    needs: build-and-quality

    steps:
    - name: Checkout repository
      uses: actions/checkout@v4

    - name: Set up Docker Buildx
      uses: docker/setup-buildx-action@v3

    - name: Download Build Artifact
      uses: actions/download-artifact@v4
      with:
        name: build-artifacts
        path: digibank-parent/digibank-app/target/

    - name: Build Docker Image
      run: |
        echo "::group::Building WildFly Docker Image"
        docker build -f Dockerfile.wildfly -t digibank-app:test .
        echo "::endgroup::"
        
        echo "::group::Docker Image Info"
        docker images digibank-app:test
        echo "::endgroup::"

    - name: Test Docker Compose
      run: |
        echo "::group::Testing Docker Compose Configuration"
        docker compose config
        echo "::endgroup::"
