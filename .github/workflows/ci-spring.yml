name: Java CI/CD Pipeline (Spring Boot)

# This workflow validates the Spring Boot modular monolith version of DigiBank.
# It proves that the Spring version can compile, run tests, and pass Maven verify.
on:
  # Run the Spring pipeline when code is pushed to the main classroom branches.
  push:
    branches: [ "main", "develop" ]
  # Run the same Spring checks before merging pull requests into those branches.
  pull_request:
    branches: [ "main", "develop" ]

jobs:
  # This job checks only the Spring Boot monolith under digibank-parent-spring.
  build-and-verify-spring:
    runs-on: ubuntu-latest

    steps:
    # Download the repository source code into the GitHub Actions runner.
    - name: Checkout repository
      uses: actions/checkout@v4

    # Install Java 17 because the Spring Boot app is compiled for JDK 17.
    # Maven caching avoids downloading the same dependencies on every CI run.
    - name: Set up JDK 17
      uses: actions/setup-java@v4
      with:
        java-version: '17'
        distribution: 'temurin'
        cache: maven

    # Run Maven's full verify lifecycle for the Spring Boot monolith.
    # This compiles the modules, runs tests, and checks that the WAR can be built.
    - name: Build and Verify with Maven (Spring Boot)
      run: mvn -B clean verify --file digibank-parent-spring/pom.xml
